<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0e0e15"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111114" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1240" height="820" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="160" x2="1240" y2="160"/>
    <line x1="0" y1="320" x2="1240" y2="320"/>
    <line x1="0" y1="480" x2="1240" y2="480"/>
    <line x1="0" y1="640" x2="1240" y2="640"/>
    <line x1="200" y1="0" x2="200" y2="820"/>
    <line x1="400" y1="0" x2="400" y2="820"/>
    <line x1="620" y1="0" x2="620" y2="820"/>
    <line x1="840" y1="0" x2="840" y2="820"/>
    <line x1="1040" y1="0" x2="1040" y2="820"/>
  </g>

  <!-- Background Decorative Glow -->
  <circle cx="240" cy="180" r="200" fill="#8b5cf6" fill-opacity="0.12" filter="blur(70px)"/>
  <circle cx="1020" cy="620" r="220" fill="#3b82f6" fill-opacity="0.1" filter="blur(80px)"/>

  <!-- Top App Navigation Bar -->
  <g transform="translate(40, 30)">
    <rect width="1160" height="64" rx="12" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" filter="url(#cardShadow)"/>
    
    <!-- Window Control Dots -->
    <circle cx="30" cy="32" r="5.5" fill="#ef4444" opacity="0.85"/>
    <circle cx="48" cy="32" r="5.5" fill="#f59e0b" opacity="0.85"/>
    <circle cx="66" cy="32" r="5.5" fill="#10b981" opacity="0.85"/>

    <!-- App Title & Breadcrumb -->
    <text x="98" y="38" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="0.5">ONE MEKONG</text>
    <text x="218" y="38" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">/ Restaurant &amp; Hotel Backend Ecosystem</text>

    <!-- Status Badges -->
    <g transform="translate(710, 18)">
      <!-- NestJS Badge -->
      <rect x="0" y="0" width="120" height="28" rx="14" fill="#e0234e" fill-opacity="0.15" stroke="#e0234e" stroke-opacity="0.35"/>
      <circle cx="15" cy="14" r="3.5" fill="#e0234e"/>
      <text x="28" y="18" fill="#fda4af" font-family="monospace" font-size="11" font-weight="600">NestJS Core</text>

      <!-- BullMQ + Redis Badge -->
      <rect x="132" y="0" width="145" height="28" rx="14" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-opacity="0.35"/>
      <circle cx="147" cy="14" r="3.5" fill="#ef4444"/>
      <text x="160" y="18" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="600">BullMQ + Redis</text>

      <!-- MongoDB Badge -->
      <rect x="288" y="0" width="145" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.35"/>
      <circle cx="303" cy="14" r="3.5" fill="#10b981"/>
      <text x="316" y="18" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="600">MongoDB Index</text>
    </g>
  </g>

  <!-- Main Left Card: Hotel Booking Engine & Order Generator -->
  <g transform="translate(40, 114)">
    <rect width="640" height="410" rx="14" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <text x="28" y="40" fill="#a1a1aa" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">HOTEL BOOKING &amp; ORDER ENGINE</text>
    <text x="28" y="72" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="600">High-Concurrency Booking Architecture</text>
    
    <!-- Metric Boxes -->
    <g transform="translate(28, 96)">
      <rect width="180" height="90" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
      <text x="16" y="28" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Unique Order UID Rate</text>
      <text x="16" y="60" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">1,000,000,000</text>
      <text x="16" y="78" fill="#a1a1aa" font-family="monospace" font-size="10">Non-colliding / Year</text>
    </g>

    <g transform="translate(220, 96)">
      <rect width="176" height="90" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
      <text x="16" y="28" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Session Control</text>
      <text x="16" y="60" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">1 Web + 1 App</text>
      <text x="16" y="78" fill="#a1a1aa" font-family="monospace" font-size="10">JWT Concurrent Limit</text>
    </g>

    <g transform="translate(408, 96)">
      <rect width="204" height="90" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
      <text x="16" y="28" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">SMS OTP Security</text>
      <text x="16" y="60" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Rate Limited</text>
      <text x="16" y="78" fill="#a1a1aa" font-family="monospace" font-size="10">Sliding Window Redis</text>
    </g>

    <!-- Simulated REST API / Architecture Flow -->
    <g transform="translate(28, 210)">
      <rect width="584" height="172" rx="10" fill="#09090b" stroke="#27272a" stroke-width="0.8"/>
      <text x="20" y="28" fill="#71717a" font-family="monospace" font-size="11">HTTP POST /api/v1/booking/reserve</text>
      
      <g transform="translate(20, 48)">
        <rect x="0" y="0" width="105" height="36" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.4"/>
        <text x="15" y="23" fill="#c4b5fd" font-family="monospace" font-size="11">Auth Guard</text>

        <path d="M 112 18 L 132 18" stroke="#71717a" stroke-width="1.5" stroke-dasharray="3 3"/>

        <rect x="138" y="0" width="130" height="36" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.4"/>
        <text x="148" y="23" fill="#93c5fd" font-family="monospace" font-size="11">Booking Service</text>

        <path d="M 274 18 L 294 18" stroke="#71717a" stroke-width="1.5" stroke-dasharray="3 3"/>

        <rect x="300" y="0" width="120" height="36" rx="6" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.4"/>
        <text x="312" y="23" fill="#f472b6" font-family="monospace" font-size="11">BullMQ Queue</text>

        <path d="M 426 18 L 446 18" stroke="#71717a" stroke-width="1.5" stroke-dasharray="3 3"/>

        <rect x="452" y="0" width="90" height="36" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
        <text x="466" y="23" fill="#6ee7b7" font-family="monospace" font-size="11">MongoDB</text>
      </g>

      <text x="20" y="122" fill="#52525b" font-family="monospace" font-size="11">&gt; 200 OK — Order UID #OMK-2026-94819472 generated in 18ms</text>
      <text x="20" y="146" fill="#10b981" font-family="monospace" font-size="11">&gt; Async Mail Job #4812 dispatched to BullMQ worker queue</text>
    </g>
  </g>

  <!-- Right Top Card: Message Queue & Cronjob Subsystem -->
  <g transform="translate(700, 114)">
    <rect width="500" height="410" rx="14" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" filter="url(#cardShadow)"/>
    
    <text x="28" y="40" fill="#a1a1aa" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">MESSAGE QUEUE &amp; BACKGROUND TASKS</text>
    <text x="28" y="72" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="600">BullMQ + Redis Worker Pipeline</text>

    <!-- Queue Status Bars -->
    <g transform="translate(28, 96)">
      <!-- Job 1 -->
      <g transform="translate(0, 0)">
        <rect width="444" height="52" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <circle cx="22" cy="26" r="4" fill="#10b981"/>
        <text x="40" y="30" fill="#e4e4e7" font-family="monospace" font-size="12">mail.booking.confirmation</text>
        <rect x="312" y="15" width="116" height="22" rx="11" fill="#10b981" fill-opacity="0.15"/>
        <text x="326" y="30" fill="#34d399" font-family="monospace" font-size="10">PROCESSED (0ms)</text>
      </g>

      <!-- Job 2 -->
      <g transform="translate(0, 64)">
        <rect width="444" height="52" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <circle cx="22" cy="26" r="4" fill="#3b82f6"/>
        <text x="40" y="30" fill="#e4e4e7" font-family="monospace" font-size="12">cron.room.availability_sync</text>
        <rect x="312" y="15" width="116" height="22" rx="11" fill="#3b82f6" fill-opacity="0.15"/>
        <text x="336" y="30" fill="#60a5fa" font-family="monospace" font-size="10">SCHEDULED</text>
      </g>

      <!-- Job 3 -->
      <g transform="translate(0, 128)">
        <rect width="444" height="52" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <circle cx="22" cy="26" r="4" fill="#8b5cf6"/>
        <text x="40" y="30" fill="#e4e4e7" font-family="monospace" font-size="12">auth.otp.sms_rate_cleaner</text>
        <rect x="312" y="15" width="116" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.15"/>
        <text x="342" y="30" fill="#c084fc" font-family="monospace" font-size="10">RECURRING</text>
      </g>

      <!-- Live Throughput Graph simulation -->
      <g transform="translate(0, 196)">
        <rect width="444" height="86" rx="8" fill="#09090b" stroke="#27272a" stroke-width="0.8"/>
        <text x="16" y="24" fill="#71717a" font-family="monospace" font-size="10">REDIS QUEUE THROUGHPUT / LATENCY</text>
        <path d="M 16 62 Q 65 35, 120 50 T 230 40 T 340 55 T 430 30" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
        <text x="340" y="74" fill="#a855f7" font-family="monospace" font-size="10">~1,850 ops/sec</text>
      </g>
    </g>
  </g>

  <!-- Bottom Panel: MongoDB Indexing & Query Optimization -->
  <g transform="translate(40, 542)">
    <rect width="1160" height="248" rx="14" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1" filter="url(#cardShadow)"/>
    
    <text x="28" y="38" fill="#a1a1aa" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">DATABASE QUERY PERFORMANCE &amp; INDEXING STRATEGY</text>
    <text x="28" y="68" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600">MongoDB Multi-Tier Index Architecture</text>

    <g transform="translate(28, 92)">
      <!-- Tier 1 -->
      <g transform="translate(0, 0)">
        <rect width="350" height="116" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <text x="20" y="32" fill="#10b981" font-family="monospace" font-size="13" font-weight="600">Single Index</text>
        <text x="20" y="62" fill="#a1a1aa" font-family="monospace" font-size="11">{ "orderCode": 1 }, { "phone": 1 }</text>
        <text x="20" y="92" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">O(1) Direct Key Point-Lookups</text>
      </g>

      <!-- Tier 2 -->
      <g transform="translate(376, 0)">
        <rect width="350" height="116" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <text x="20" y="32" fill="#3b82f6" font-family="monospace" font-size="13" font-weight="600">Compound Index</text>
        <text x="20" y="62" fill="#a1a1aa" font-family="monospace" font-size="11">{ "hotelId": 1, "checkIn": 1, "status": 1 }</text>
        <text x="20" y="92" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Optimized Multi-Filter Booking Search</text>
      </g>

      <!-- Tier 3 -->
      <g transform="translate(752, 0)">
        <rect width="350" height="116" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <text x="20" y="32" fill="#a855f7" font-family="monospace" font-size="13" font-weight="600">Partial Index</text>
        <text x="20" y="62" fill="#a1a1aa" font-family="monospace" font-size="11">{ "status": "ACTIVE", "isDeleted": false }</text>
        <text x="20" y="92" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Reduced RAM Index Storage by 65%</text>
      </g>
    </g>
  </g>
</svg>
